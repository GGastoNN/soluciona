name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Firebase package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          expected = "com.fixhome.soluciona"
          path = pathlib.Path("app/google-services.json")
          if not path.exists():
              print(f"::error title=Firebase config missing::Descargá google-services.json para {expected} y guardalo en app/google-services.json")
              sys.exit(1)
          data = json.loads(path.read_text(encoding="utf-8"))
          packages = [c.get("client_info", {}).get("android_client_info", {}).get("package_name", "") for c in data.get("client", [])]
          if expected not in packages:
              print(f"::error title=Firebase package mismatch::google-services.json contiene {packages or ['sin package']} y debe contener {expected}.")
              sys.exit(1)
          matching = next(c for c in data.get("client", []) if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected)
          app_id = matching.get("client_info", {}).get("mobilesdk_app_id", "")
          legacy_app_id = "1:1010518269428:android:20355f9950cd96fd17ada1"
          if not app_id or app_id == legacy_app_id:
              print("::error title=Firebase app ID incorrecto::Descargá el google-services.json real de com.fixhome.soluciona.")
              sys.exit(1)
          print(f"Firebase OK: {expected} / {app_id}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Soluciona-0.8.0-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Soluciona-0.8.0-debug
          path: Soluciona-0.8.0-debug.apk
          if-no-files-found: error
          retention-days: 14
