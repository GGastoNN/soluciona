name: Build Play Console AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Firebase package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          expected = "com.fixhome.soluciona"
          path = pathlib.Path("app/google-services.json")
          if not path.exists():
              print(f"::error title=Firebase config missing::Descargá google-services.json para {expected} y guardalo en app/google-services.json")
              sys.exit(1)
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as e:
              print(f"::error title=Firebase config invalid::{e}")
              sys.exit(1)
          packages = [c.get("client_info", {}).get("android_client_info", {}).get("package_name", "") for c in data.get("client", [])]
          if expected not in packages:
              print(f"::error title=Firebase package mismatch::google-services.json contiene {packages or ['sin package']} y debe contener {expected}. Registrá la nueva app Android en Firebase y reemplazá el archivo.")
              sys.exit(1)
          matching = next(c for c in data.get("client", []) if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected)
          app_id = matching.get("client_info", {}).get("mobilesdk_app_id", "")
          legacy_app_id = "1:1010518269428:android:20355f9950cd96fd17ada1"
          if not app_id or app_id == legacy_app_id:
              print("::error title=Firebase app ID incorrecto::El archivo parece ser el google-services.json anterior con package_name editado a mano. Registrá com.fixhome.soluciona como una NUEVA app Android en Firebase y descargá su google-services.json real.")
              sys.exit(1)
          print(f"Firebase OK: {expected} / {app_id}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/soluciona-upload-key.jks"
          test -s "$RUNNER_TEMP/soluciona-upload-key.jks"

      - name: Build signed App Bundle
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          DOCUMENTS_API_URL: ${{ vars.DOCUMENTS_API_URL }}
        shell: bash
        run: |
          gradle --no-daemon :app:bundleRelease \
            -PKEYSTORE_FILE="$RUNNER_TEMP/soluciona-upload-key.jks" \
            -PKEYSTORE_PASSWORD="$KS_PASS" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASS" \
            -PADMOB_APP_ID="$ADMOB_APP_ID" \
            -PADMOB_BANNER_ID="$ADMOB_BANNER_ID" \
            -PDOCUMENTS_API_URL="$DOCUMENTS_API_URL"

      - name: Prepare release artifacts
        shell: bash
        run: |
          cp app/build/outputs/bundle/release/app-release.aab Soluciona-0.6.3-play.aab
          mkdir -p play-artifacts
          cp Soluciona-0.6.3-play.aab play-artifacts/
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt play-artifacts/mapping-0.6.3.txt
          fi

      - name: Upload Play artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Soluciona-0.6.3-play
          path: play-artifacts/
          if-no-files-found: error
          retention-days: 30
