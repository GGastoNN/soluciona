name: Build Play Console AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Firebase package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          expected = "com.fixhome.soluciona"
          path = pathlib.Path("app/google-services.json")
          if not path.exists(): sys.exit("Falta app/google-services.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          matches = [c for c in data.get("client", []) if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected]
          if not matches: sys.exit(f"Firebase package debe ser {expected}")
          app_id = matches[0].get("client_info", {}).get("mobilesdk_app_id", "")
          if not app_id or app_id == "1:1010518269428:android:20355f9950cd96fd17ada1": sys.exit("Firebase App ID incorrecto")
          print(f"Firebase OK: {expected} / {app_id}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/soluciona-upload-key.jks"
          test -s "$RUNNER_TEMP/soluciona-upload-key.jks"

      - name: Build signed App Bundle
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          DOCUMENTS_API_URL: ${{ vars.DOCUMENTS_API_URL }}
          MARKETPLACE_API_URL: ${{ vars.MARKETPLACE_API_URL }}
        shell: bash
        run: |
          gradle --no-daemon :app:bundleRelease \
            -PKEYSTORE_FILE="$RUNNER_TEMP/soluciona-upload-key.jks" \
            -PKEYSTORE_PASSWORD="$KS_PASS" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASS" \
            -PADMOB_APP_ID="$ADMOB_APP_ID" \
            -PADMOB_BANNER_ID="$ADMOB_BANNER_ID" \
            -PDOCUMENTS_API_URL="$DOCUMENTS_API_URL" \
            -PMARKETPLACE_API_URL="$MARKETPLACE_API_URL"

      - name: Prepare release artifacts
        shell: bash
        run: |
          cp app/build/outputs/bundle/release/app-release.aab Soluciona-0.8.0-play.aab
          mkdir -p play-artifacts
          cp Soluciona-0.8.0-play.aab play-artifacts/
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt play-artifacts/mapping-0.8.0.txt
          fi

      - name: Upload Play artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Soluciona-0.8.0-play
          path: play-artifacts/
          if-no-files-found: error
          retention-days: 30
