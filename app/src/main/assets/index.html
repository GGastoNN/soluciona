<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#2563EB">
<title>Soluciona.</title>
<style>
:root{
  --blue:#2563EB;--blue2:#0B66F6;--navy:#14213D;--soft:#EAF1FE;--bg:#F4F7FC;--card:#FFFFFF;
  --muted:#64748B;--line:#E7EDF5;--green:#16A34A;--amber:#F59E0B;--red:#DC2626;--shadow:0 10px 30px rgba(20,33,61,.08);
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#eaf0f8;color:var(--navy);font-family:"Space Grotesk","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hide{display:none!important}
#shell{height:100%;max-width:440px;margin:auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(20,33,61,.18)}
#top{flex:none;padding:calc(var(--safe-top) + 8px) 17px 6px;background:rgba(244,247,252,.96);backdrop-filter:blur(12px);z-index:5}
.brandrow{height:46px;display:flex;align-items:center;gap:9px}.brandmark{width:31px;height:31px;border-radius:9px;overflow:hidden;box-shadow:0 4px 12px rgba(37,99,235,.2)}.brandmark img{width:100%;height:100%;object-fit:cover}.brandname{font-weight:800;font-size:18px;letter-spacing:-.5px}.brandname i{font-style:normal;color:var(--blue)}
.location{font-size:10px;color:var(--muted);font-weight:650;margin-top:-2px}.grow{flex:1}.iconbtn{width:36px;height:36px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--navy);font-size:18px}.iconbtn:active{background:var(--soft)}
#main{flex:1;overflow:auto;padding:8px 17px 104px;scrollbar-width:none}#main::-webkit-scrollbar{display:none}
#nav{position:absolute;z-index:9;left:12px;right:12px;bottom:calc(10px + var(--safe-bottom));height:69px;padding:7px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 35px rgba(20,33,61,.17);display:grid;grid-template-columns:repeat(4,1fr);backdrop-filter:blur(14px)}
.navb{border:0;background:transparent;border-radius:15px;color:#8291a6;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.navb .ni{font-size:20px;line-height:1}.navb.on{background:#eef4ff;color:var(--blue)}
.splash{position:fixed;inset:0;z-index:100;background:linear-gradient(155deg,#2095ff 0%,#0768f7 48%,#0752df 100%);display:grid;place-items:center;transition:opacity .35s,visibility .35s}.splash.off{opacity:0;visibility:hidden}.splashbox{text-align:center;color:white;margin-top:-35px}.splashlogo{width:112px;height:112px;border-radius:31px;object-fit:cover;box-shadow:0 18px 45px rgba(0,30,100,.22);margin-bottom:18px}.splashtitle{font-size:31px;font-weight:850;letter-spacing:-1px}.splashtag{font-size:13px;font-weight:600;opacity:.88;margin-top:3px}.splashline{height:3px;width:46px;border-radius:8px;background:#fff;margin:82px auto 0;opacity:.8}
h1{font-size:28px;line-height:1.08;letter-spacing:-1px;margin:8px 0 7px}h2{font-size:23px;letter-spacing:-.6px;margin:7px 0 5px}h3{font-size:17px;margin:20px 0 9px}.muted{color:var(--muted);font-size:13px;line-height:1.4}.eyebrow{font-size:11px;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.7px}.sectionTitle{font-size:17px;font-weight:800;margin:18px 0 10px}.row{display:flex;align-items:center}.gap8{gap:8px}.gap10{gap:10px}.between{justify-content:space-between}.center{text-align:center}.mt10{margin-top:10px}.mt16{margin-top:16px}
.searchbox{background:white;border:1px solid var(--line);border-radius:15px;height:48px;display:flex;align-items:center;gap:8px;padding:0 13px;box-shadow:0 5px 14px rgba(20,33,61,.04)}.searchbox input{border:0;outline:0;width:100%;font-size:14px;color:var(--navy);background:transparent}.searchico{font-size:17px;color:#91a1b5}
.heroCard{margin-top:9px;border-radius:20px;padding:17px 16px;background:linear-gradient(135deg,#176cf7,#398bf4);color:white;box-shadow:0 14px 28px rgba(37,99,235,.22);overflow:hidden;position:relative}.heroCard:after{content:"";width:135px;height:135px;border-radius:50%;position:absolute;right:-45px;bottom:-68px;background:rgba(255,255,255,.13)}.heroCard b{font-size:18px}.heroCard p{font-size:12px;line-height:1.45;margin:5px 0 0;max-width:275px;opacity:.92}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cat{background:white;border:1px solid var(--line);border-radius:17px;padding:12px 7px 10px;text-align:center;min-height:88px;box-shadow:0 4px 13px rgba(20,33,61,.035);color:var(--navy)}.cat:active,.cat.on{border-color:#9cbcff;background:#f4f8ff}.catIcon{height:42px;display:grid;place-items:center}.catIcon svg{width:29px;height:29px;stroke:var(--blue);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.catName{font-size:11px;font-weight:750}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:750;font-size:12px;padding:6px 0}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:14px;box-shadow:0 6px 18px rgba(20,33,61,.045);margin:0 0 11px}.procard{display:grid;grid-template-columns:58px 1fr auto;gap:11px;align-items:center}.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#dbe7f7;border:2px solid white;box-shadow:0 2px 8px rgba(20,33,61,.12)}.proName{font-size:14px;font-weight:850}.proMeta{font-size:10.5px;color:var(--muted);margin-top:2px}.rating{font-size:11px;color:#f59e0b;font-weight:800}.verifyMini{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:800;color:var(--green);background:#ebf9ef;padding:3px 6px;border-radius:8px;margin-top:4px}.heart{border:0;background:none;font-size:20px;color:#8190a6}.dist{text-align:right;font-size:10px;color:var(--muted);margin-top:5px}.price{font-size:11px;font-weight:800;color:var(--navy)}
.filterbar{display:flex;gap:7px;overflow:auto;padding:4px 0 10px;scrollbar-width:none}.chip{border:1px solid var(--line);background:#fff;color:#5b6b80;padding:8px 11px;border-radius:999px;white-space:nowrap;font-size:11px;font-weight:700}.chip.on{color:white;background:var(--blue);border-color:var(--blue)}
.profileTop{text-align:center;padding-top:5px}.avatarXL{width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid white;box-shadow:0 10px 25px rgba(20,33,61,.15)}.profileName{font-size:23px;font-weight:850;margin:8px 0 1px}.stars{color:#f59e0b;font-size:13px;font-weight:800}.verifyGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.verifyItem{border-radius:12px;padding:9px 9px;background:#f6f9fd;border:1px solid var(--line);font-size:10.5px;display:flex;align-items:center;gap:6px;color:#526176}.verifyItem.ok span:first-child{color:var(--green)}.verifyItem.warn span:first-child{color:var(--amber)}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{padding:6px 8px;border-radius:999px;background:#eef4ff;color:#3b5f96;font-size:10px;font-weight:700}.bio{font-size:12px;line-height:1.55;color:#4d5d72}
.primary{width:100%;height:48px;border:0;border-radius:14px;background:linear-gradient(135deg,#176df7,#0b66f6);color:white;font-weight:850;font-size:14px;box-shadow:0 9px 20px rgba(37,99,235,.18)}.primary:disabled{opacity:.45;box-shadow:none}.secondary{width:100%;height:45px;border:1px solid #cfd9e7;border-radius:14px;background:white;color:var(--navy);font-weight:750;font-size:13px}.dangerBtn{color:var(--red);border-color:#fecaca}.stack{display:grid;gap:8px}
.backrow{display:flex;align-items:center;gap:8px;margin:2px 0 8px}.back{width:34px;height:34px;border:0;background:white;border-radius:11px;border:1px solid var(--line);color:var(--navy);font-size:18px}.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0 18px}.step{height:5px;border-radius:8px;background:#dce5f0}.step.on{background:var(--blue)}
.fieldLabel{font-size:12px;font-weight:800;margin:13px 0 6px}.input,textarea,select{width:100%;background:white;border:1px solid var(--line);border-radius:14px;padding:12px 13px;color:var(--navy);outline:0;font-size:13px}.input:focus,textarea:focus,select:focus{border-color:#93b5fb;box-shadow:0 0 0 3px #eaf1fe}textarea{min-height:105px;resize:none}.urgency{display:grid;grid-template-columns:1fr 1fr;gap:9px}.urg{border:1px solid var(--line);border-radius:14px;background:white;padding:12px;text-align:left;color:var(--navy)}.urg.on{border-color:#ff8b8b;background:#fff4f4}.urg b{font-size:12px}.urg small{display:block;color:var(--muted);margin-top:2px;font-size:10px}
.alert{border-radius:14px;padding:11px 12px;font-size:11px;line-height:1.45;background:#fff3f3;color:#9f1f1f;border:1px solid #ffd4d4;margin-top:10px}.info{border-radius:14px;padding:11px 12px;font-size:11px;line-height:1.45;background:#edf4ff;color:#31588d;border:1px solid #dbe8ff;margin-top:10px}.photoBtn{height:47px;width:100%;border:1px dashed #aabbd0;background:#fbfdff;border-radius:14px;color:#55708f;font-size:12px;font-weight:750}
.summaryPro{display:flex;gap:10px;align-items:center}.summaryPro img{width:48px;height:48px;border-radius:50%;object-fit:cover}.moneyRow{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);margin-top:11px}.moneyRow b{font-size:16px}.fine{font-size:9.5px;color:var(--muted);line-height:1.45}
.statusHero{text-align:center;padding:7px 0 12px}.successCircle{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#eaf8ef;color:var(--green);font-size:29px;margin:3px auto 8px}.timeline{margin:12px 0}.tl{display:grid;grid-template-columns:30px 1fr;gap:9px;min-height:68px}.tlDot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:white;background:#cbd5e1;font-size:11px;position:relative}.tl:not(:last-child) .tlDot:after{content:"";position:absolute;top:24px;bottom:-44px;width:2px;background:#dbe3ed;left:11px}.tl.done .tlDot{background:var(--green)}.tl.active .tlDot{background:var(--blue);box-shadow:0 0 0 5px #e9f1ff}.tl b{font-size:12px}.tl p{margin:2px 0 0;color:var(--muted);font-size:10px}.map{height:132px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#e9f0f8,#dbe7f4);position:relative;border:1px solid var(--line)}.map:before,.map:after{content:"";position:absolute;background:#fff;opacity:.9}.map:before{width:170%;height:12px;left:-40%;top:56px;transform:rotate(-11deg)}.map:after{height:170%;width:10px;left:57%;top:-35%;transform:rotate(16deg)}.pin{position:absolute;z-index:2;left:58%;top:44%;width:31px;height:31px;border-radius:50% 50% 50% 0;background:var(--blue);transform:rotate(-45deg);box-shadow:0 5px 10px #8aa9d2}.pin:after{content:"";position:absolute;width:9px;height:9px;background:white;border-radius:50%;left:11px;top:11px}.driver{margin-top:10px;display:flex;align-items:center;gap:9px;padding:9px;background:white;border-radius:14px;border:1px solid var(--line)}.driver img{width:39px;height:39px;border-radius:50%;object-fit:cover}.driver .call{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:#eef4ff;color:var(--blue);font-size:17px}
.chatWrap{display:flex;flex-direction:column;min-height:calc(100vh - 190px)}.chatHead{display:flex;align-items:center;gap:9px;padding:2px 0 12px;border-bottom:1px solid var(--line)}.chatHead img{width:40px;height:40px;border-radius:50%;object-fit:cover}.online{font-size:9px;color:var(--green)}.messages{flex:1;padding:14px 0;display:flex;flex-direction:column;gap:8px}.bubble{max-width:77%;padding:10px 12px;border-radius:16px 16px 16px 5px;background:white;border:1px solid var(--line);font-size:11px;line-height:1.4;box-shadow:0 3px 8px rgba(20,33,61,.03)}.bubble.me{align-self:flex-end;background:var(--blue);color:white;border-color:var(--blue);border-radius:16px 16px 5px 16px}.msgtime{font-size:8px;opacity:.65;margin-top:3px}.chatInput{position:sticky;bottom:78px;display:flex;gap:7px;background:var(--bg);padding:7px 0}.chatInput input{height:46px;flex:1;border:1px solid var(--line);border-radius:15px;padding:0 13px;outline:0;background:white}.send{width:46px;border-radius:15px;border:0;background:var(--blue);color:white;font-size:17px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(13,25,48,.48);display:none;align-items:flex-end}.sheet.open{display:flex}.sheetBox{width:min(440px,100%);margin:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 17px calc(18px + var(--safe-bottom));max-height:86vh;overflow:auto}.sheetGrip{width:45px;height:5px;border-radius:9px;background:#cbd5e1;margin:-5px auto 14px}.legalText{font-size:11px;line-height:1.55;color:#485a72;white-space:pre-line}.switchrow{display:flex;align-items:flex-start;gap:8px;font-size:11px;line-height:1.35;color:#506176;margin:9px 0}.switchrow input{margin-top:2px}.link{color:var(--blue);font-weight:750;text-decoration:none}.note{font-size:9px;color:#8a99ab;margin-top:7px;line-height:1.45}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="splashbox"><img src="brand_icon.png" class="splashlogo"><div class="splashtitle">Soluciona.</div><div class="splashtag">Encontrá. Resolvé. Listo.</div><div class="splashline"></div></div></div>
<div id="shell"><header id="top"></header><main id="main"></main><nav id="nav"></nav></div><div class="sheet" id="sheet"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$ '+Number(n||0).toLocaleString('es-AR');
const CATS=[
 {id:'plom',name:'Plomería',sub:'Pérdidas y cañerías',price:30000},
 {id:'elec',name:'Electricidad',sub:'Luces y enchufes',price:32000},
 {id:'gas',name:'Gas',sub:'Solo matriculados',price:35000},
 {id:'clima',name:'Climatización',sub:'Aire y refrigeración',price:38000},
 {id:'cerr',name:'Cerrajería',sub:'Puertas y cerraduras',price:25000},
 {id:'cons',name:'Construcción',sub:'Obra y reparaciones',price:40000}
];
const PROS=[
 {name:'Martín López',role:'Electricista · Matriculado',cats:['elec','gas'],rating:4.9,jobs:87,dist:1.2,price:35000,img:'pro_martin.jpg',bio:'Más de 10 años de experiencia en instalaciones domiciliarias y comerciales. Trabajo prolijo, diagnóstico claro y seguimiento del servicio.'},
 {name:'Carolina Ruiz',role:'Electricista',cats:['elec'],rating:4.8,jobs:64,dist:2.1,price:33000,img:'pro_carla.jpg',bio:'Electricista domiciliaria especializada en reparaciones, tableros y mantenimiento preventivo.'},
 {name:'Diego Fernández',role:'Climatización',cats:['clima','elec'],rating:4.9,jobs:110,dist:3.4,price:38000,img:'pro_diego.jpg',bio:'Técnico en climatización, instalación y mantenimiento de equipos split y refrigeración.'}
];
const RISKS=[
 [/(olor|fuga|p[eé]rdida).*gas|gas.*(olor|fuga|p[eé]rdida)/i,'Posible riesgo de gas','Cerrá la llave de paso, ventilá y evitá fuego o interruptores. Si hay riesgo inmediato, contactá al servicio de emergencia correspondiente.'],
 [/chispa|cortocircuito|cable pelado|humo|electrocut/i,'Posible riesgo eléctrico','No toques cables. Cortá la energía solo si es seguro y contactá un servicio de emergencia si existe peligro.'],
 [/inund|ca[nñ]o roto|sale mucha agua/i,'Pérdida fuerte de agua','Cerrá la llave de paso. Si el agua alcanza instalaciones eléctricas, evitá el contacto.']
];
const LEGAL={
 privacy:`POLÍTICA DE PRIVACIDAD — BORRADOR DE BETA\n\nEsta versión funciona localmente en el dispositivo. Los datos de cuenta, solicitudes, chats y preferencias se conservan localmente para demostrar el flujo. No hay verificación documental remota, Firebase ni procesamiento real de pagos.\n\nPara producción, la política definitiva deberá identificar al responsable, finalidades, categorías de datos, proveedores, plazos de conservación, medidas de seguridad y canales para ejercer derechos. Los datos de identidad, matrícula, antecedentes y seguro requerirán controles específicos.\n\nEste texto debe ser revisado por asesoría jurídica antes del lanzamiento comercial.`,
 client:`TÉRMINOS DEL CLIENTE — BORRADOR DE BETA\n\nSoluciona facilita el contacto entre clientes y prestadores. Los perfiles, distancias, precios e insignias de esta beta son datos demostrativos. El precio mostrado es una referencia de visita/diagnóstico. Todo adicional debe ser informado y aceptado antes de comenzar.\n\nLa beta no procesa ni retiene dinero real. El esquema definitivo deberá indicar claramente quién procesa el pago, comisiones, devoluciones y cancelaciones.\n\nAnte emergencias, Soluciona no reemplaza servicios de emergencia ni autoridades.`,
 provider:`TÉRMINOS DEL PRESTADOR — BORRADOR DE BETA\n\nEl prestador deberá mantener actualizados identidad, matrículas/habilitaciones y pólizas cuando correspondan. Una insignia solo podrá mostrarse como verificada luego de una validación real.\n\nEl prestador es responsable por la calidad del trabajo, sus obligaciones profesionales, fiscales y de seguridad. Para categorías de mayor riesgo se prevé exigir documentación adicional y cobertura de Responsabilidad Civil.\n\nEste texto requiere revisión jurídica antes de operar comercialmente.`
};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}, save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let user=load('sol_user',null), requests=load('sol_requests',[]), fav=load('sol_fav',[]);
let S={screen:'home',cat:'elec',problem:'Se perdió agua debajo de la pileta y necesito que lo revisen.',urgent:false,addr:'',day:'Hoy',slot:'Tarde (12-18)',pro:PROS[0],sort:'dist',last:null,chatId:null};
function icon(type){const m={
 plom:`<svg viewBox="0 0 24 24"><path d="M12 2C8 7 5.5 10 5.5 14A6.5 6.5 0 0 0 18.5 14C18.5 10 16 7 12 2Z"/></svg>`,
 elec:`<svg viewBox="0 0 24 24"><path d="M13 2 5 14h6l-1 8 9-13h-6l0-7Z"/></svg>`,
 gas:`<svg viewBox="0 0 24 24"><path d="M13 2c1 5-3 5-2 9 1-2 3-2 4-4 3 3 4 6 3 9-1 4-5 6-8 5-5-1-7-7-4-11 1 3 3 3 4 2 2-2 0-5 3-10Z"/></svg>`,
 clima:`<svg viewBox="0 0 24 24"><path d="M12 2v20M4 6l16 12M20 6 4 18M8 4l4 2 4-2M8 20l4-2 4 2M3 10l3 2-3 2M21 10l-3 2 3 2"/></svg>`,
 cerr:`<svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="4"/><path d="m11 12 9 9M15 16l2-2M18 19l2-2"/></svg>`,
 cons:`<svg viewBox="0 0 24 24"><path d="M3 5h7v5H3zM10 5h11v5H10zM3 10h11v5H3zM14 10h7v5h-7zM3 15h7v4H3zM10 15h11v4H10z"/></svg>`
};return m[type]||m.elec}
function category(id){return CATS.find(c=>c.id===id)||CATS[0]}
function header(){const top=$('#top'); if(['chat','profile','request','summary','status'].includes(S.screen)){top.innerHTML='';top.style.paddingBottom='0';return} top.style.paddingBottom='6px';top.innerHTML=`<div class="brandrow"><img src="brand_icon.png" class="brandmark"><div><div class="brandname">Soluciona<i>.</i></div><div class="location">📍 ${user?.zone||'Carcarañá'} · Beta local</div></div><div class="grow"></div><button class="iconbtn" onclick="openInfo()">◌</button><button class="iconbtn" onclick="go('account')">♙</button></div>`}
function nav(){const n=$('#nav'); const show=!['profile','request','summary','status','chat'].includes(S.screen);n.classList.toggle('hide',!show);if(!show)return;n.innerHTML=[['home','⌂','Inicio'],['requests','▣','Solicitudes'],['chatlist','◌','Chat'],['account','♙','Perfil']].map(x=>`<button class="navb ${S.screen===x[0]?'on':''}" onclick="go('${x[0]}')"><span class="ni">${x[1]}</span>${x[2]}</button>`).join('')}
function home(){return `<div class="eyebrow">Encontrá. Resolvé. Listo.</div><h1>¿Qué necesitás<br>solucionar?</h1><p class="muted">Profesionales de confianza, cerca tuyo.</p><div class="searchbox"><span class="searchico">⌕</span><input placeholder="Buscar servicio..." onfocus="this.blur();document.getElementById('catTitle').scrollIntoView({behavior:'smooth'})"></div><div class="heroCard"><b>Tu hogar en buenas manos.</b><p>Buscá por rubro, revisá perfiles y seguí el servicio desde la app.</p></div><div class="row between"><div class="sectionTitle" id="catTitle">Servicios</div><button class="linkbtn">Ver todos →</button></div><div class="catgrid">${CATS.map(c=>`<button class="cat ${S.cat===c.id?'on':''}" onclick="chooseCat('${c.id}')"><div class="catIcon">${icon(c.id)}</div><div class="catName">${c.name}</div></button>`).join('')}</div><div class="row between"><div class="sectionTitle">Profesionales destacados</div><button class="linkbtn" onclick="go('pros')">Ver más →</button></div>${proCard(PROS[0])}`}
function proCard(p){return `<div class="card procard" onclick="openPro('${p.name.replace(/'/g,"\\'")}')"><img class="avatar" src="${p.img}"><div><div class="proName">${p.name}</div><div class="proMeta">${p.role}</div><div class="rating">★ ${p.rating} <span style="color:#8a98aa;font-weight:600">(${p.jobs} trabajos)</span></div><div class="verifyMini">✓ Verificado <span style="font-size:8px;color:#6e7e90">DEMO</span></div></div><div><button class="heart" onclick="event.stopPropagation();toggleFav('${p.name.replace(/'/g,"\\'")}')">${fav.includes(p.name)?'♥':'♡'}</button><div class="dist">${p.dist} km</div><div class="price">Desde ${money(p.price)}</div></div></div>`}
function pros(){const list=[...PROS].sort(S.sort==='rate'?(a,b)=>b.rating-a.rating:S.sort==='price'?(a,b)=>a.price-b.price:(a,b)=>a.dist-b.dist);return `<div class="backrow"><button class="back" onclick="go('home')">‹</button><div><h2>Profesionales cerca tuyo</h2><div class="muted">${category(S.cat).name} · ${user?.zone||'Carcarañá'}</div></div></div><div class="filterbar">${[['dist','Más cerca'],['rate','Mejor puntuados'],['price','Menor precio']].map(x=>`<button class="chip ${S.sort===x[0]?'on':''}" onclick="S.sort='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${list.map(proCard).join('')}<div class="info">Las verificaciones e insignias de esta beta son demostrativas hasta que exista validación documental real.</div>`}
function profile(){const p=S.pro;return `<div class="backrow"><button class="back" onclick="go('pros')">‹</button><div class="grow"></div><button class="iconbtn">♡</button><button class="iconbtn">↗</button></div><div class="profileTop"><img class="avatarXL" src="${p.img}"><div class="profileName">${p.name}</div><div class="muted">${p.role}</div><div class="stars">★ ${p.rating} <span style="color:#718198;font-weight:600">(${p.jobs} trabajos)</span></div></div><div class="verifyGrid"><div class="verifyItem ok"><span>●</span> Identidad verificada*</div><div class="verifyItem ok"><span>●</span> Matrícula validada*</div><div class="verifyItem warn"><span>●</span> Antecedentes revisados*</div><div class="verifyItem ok"><span>●</span> Seguro RC informado*</div></div><div class="note">* Estados demostrativos. No representan verificaciones reales en esta beta.</div><h3>Servicios</h3><div class="tags">${p.cats.map(c=>`<span class="tag">${category(c).name}</span>`).join('')}<span class="tag">Instalaciones</span><span class="tag">Reparaciones</span></div><h3>Sobre ${p.name.split(' ')[0]}</h3><div class="bio">${p.bio}</div><div class="card mt16"><div class="row between"><div><div class="muted">Visita y diagnóstico</div><b>${money(p.price)}</b></div><div class="muted">A ${p.dist} km</div></div></div><button class="primary" onclick="go('request')">Solicitar servicio</button><button class="secondary mt10" onclick="legal('client')">Condiciones del servicio</button>`}
function request(){const r=RISKS.find(x=>x[0].test(S.problem));return `<div class="backrow"><button class="back" onclick="go('profile')">‹</button><div><div class="eyebrow">Paso 1 de 4</div><h2>Contanos tu problema</h2></div></div><div class="stepper">${[0,1,2,3].map((_,i)=>`<div class="step ${i===0?'on':''}"></div>`).join('')}</div><div class="fieldLabel">Descripción</div><textarea id="problem" placeholder="Ej. Se perdió agua en la cocina..." oninput="S.problem=this.value;renderRisk()">${esc(S.problem)}</textarea><div id="riskbox">${r?riskHtml(r):''}</div><div class="fieldLabel">Urgencia</div><div class="urgency"><button class="urg ${!S.urgent?'on':''}" onclick="S.urgent=false;render()"><b>🔵 Normal</b><small>Esta semana</small></button><button class="urg ${S.urgent?'on':''}" onclick="S.urgent=true;render()"><b>🔴 Urgente</b><small>Hoy / 24 h</small></button></div><div class="fieldLabel">Dirección</div><input class="input" placeholder="Calle, número, piso/depto" value="${esc(S.addr)}" oninput="S.addr=this.value"><div class="fieldLabel">¿Cuándo?</div><div class="filterbar">${['Lo antes posible','Hoy','Mañana'].map(d=>`<button class="chip ${S.day===d?'on':''}" onclick="S.day='${d}';render()">${d}</button>`).join('')}</div><div class="fieldLabel">Foto del problema <span class="muted">(opcional)</span></div><button class="photoBtn" onclick="document.getElementById('photo').click()">＋ Agregar foto</button><input id="photo" class="hide" type="file" accept="image/*"><div class="stack mt16"><button class="primary" onclick="go('summary')">Continuar</button></div>`}
function riskHtml(r){return `<div class="alert"><b>⚠ ${r[1]}</b><br>${r[2]}<div class="note" style="color:#a33">Soluciona no reemplaza servicios de emergencia.</div></div>`}
function renderRisk(){const r=RISKS.find(x=>x[0].test($('#problem').value));$('#riskbox').innerHTML=r?riskHtml(r):''}
function summary(){const p=S.pro,c=category(S.cat);return `<div class="backrow"><button class="back" onclick="go('request')">‹</button><div><div class="eyebrow">Paso 3 de 4</div><h2>Revisá tu solicitud</h2></div></div><div class="stepper">${[0,1,2,3].map((_,i)=>`<div class="step ${i<3?'on':''}"></div>`).join('')}</div><div class="card"><div class="summaryPro"><img src="${p.img}"><div><b>${p.name}</b><div class="muted">${p.role}</div><div class="rating">★ ${p.rating}</div></div></div><div class="moneyRow"><span>Visita / diagnóstico</span><b>${money(p.price)}</b></div><div class="fine">El precio final del trabajo se informa antes de comenzar. Los importes de esta beta son demostrativos.</div></div><div class="card"><b>${c.name}</b><div class="muted mt10">${esc(S.problem)||'Sin descripción'}</div><div class="fine mt10">📍 ${esc(S.addr)||'Dirección pendiente'}<br>🗓 ${S.day} ${S.urgent?'· Urgente':''}</div></div><div class="info">La beta no procesa ni retiene dinero real. El flujo de pagos se conectará a un proveedor habilitado antes del lanzamiento.</div><button class="primary" onclick="submitRequest()">Confirmar solicitud</button><button class="secondary mt10" onclick="legal('client')">Ver términos</button>`}
function status(){const r=S.last||requests[0];if(!r)return emptyRequests();const step=Math.max(0,r.status||0);const stages=[['Solicitud creada','Recibimos tu pedido'],['Profesional asignado',`${r.pro.name} tomó el servicio`],['En camino','El profesional va hacia tu domicilio'],['En progreso','El trabajo está siendo realizado'],['Finalizar y calificar','Confirmá cuando esté resuelto']];return `<div class="backrow"><button class="back" onclick="go('requests')">‹</button><div><div class="eyebrow">Seguimiento</div><h2>Estado del servicio</h2></div></div><div class="statusHero"><div class="successCircle">✓</div><b>${step>=2?'Ya está en marcha':'Solicitud enviada'}</b><div class="muted">Te mostramos cada avance del servicio.</div></div><div class="card timeline">${stages.map((x,i)=>`<div class="tl ${i<step?'done':i===step?'active':''}"><div class="tlDot">${i<step?'✓':i+1}</div><div><b>${x[0]}</b><p>${x[1]}</p></div></div>`).join('')}</div><div class="map"><div class="pin"></div></div><div class="driver"><img src="${r.pro.img}"><div><b style="font-size:11px">${r.pro.name}</b><div class="muted" style="font-size:9px">${step>=2?'Está en camino':'Profesional asignado'}</div></div><button class="call" onclick="openChat(rId())">◌</button><a href="tel:+543410000000" class="call" style="display:grid;place-items:center;text-decoration:none">☎</a></div><div class="stack mt16"><button class="primary" onclick="advanceStatus()">${step<4?'Simular siguiente estado':'Confirmar finalización'}</button><button class="secondary" onclick="openChat(rId())">Abrir chat</button><button class="secondary dangerBtn" onclick="reportIssue(rId())">Reportar un problema</button></div>`}
function emptyRequests(){return `<div class="center" style="padding:70px 15px"><div style="font-size:45px">⌂</div><h2>Todavía no hay solicitudes</h2><p class="muted">Cuando pidas un servicio, vas a poder seguirlo desde acá.</p><button class="primary mt16" onclick="go('home')">Buscar un profesional</button></div>`}
function requestsView(){if(!requests.length)return emptyRequests();return `<h2>Mis solicitudes</h2><p class="muted">Seguí el estado de tus servicios.</p>${requests.map(r=>`<div class="card" onclick="S.last=r;go('status')"><div class="row between"><div><b>${category(r.cat).name}</b><div class="muted">${r.pro.name}</div></div><span class="tag">${['Solicitado','Asignado','En camino','En progreso','Finalizado'][r.status||0]}</span></div><div class="fine mt10">📍 ${esc(r.addr||'Dirección sin completar')}<br>🗓 ${r.day}${r.urgent?' · Urgente':''}</div></div>`).join('')}`}
function chatList(){if(!requests.length)return emptyRequests();return `<h2>Mensajes</h2><p class="muted">Conversaciones asociadas a tus servicios.</p>${requests.map(r=>`<div class="card row gap10" onclick="openChat(${r.id})"><img class="avatar" src="${r.pro.img}"><div><b>${r.pro.name}</b><div class="muted">${r.messages?.length?r.messages[r.messages.length-1].text:'Escribile para coordinar detalles.'}</div></div><div class="grow"></div><span style="color:var(--blue)">›</span></div>`).join('')}`}
function chatView(){const r=requests.find(x=>x.id===S.chatId)||S.last;if(!r)return emptyRequests();const msgs=r.messages||[];return `<div class="backrow"><button class="back" onclick="go('chatlist')">‹</button></div><div class="chatWrap"><div class="chatHead"><img src="${r.pro.img}"><div><b>${r.pro.name}</b><div class="online">● En línea · Demo local</div></div><div class="grow"></div><a href="tel:+543410000000" class="iconbtn" style="text-decoration:none">☎</a><button class="iconbtn">⋮</button></div><div class="messages" id="messages">${msgs.length?msgs.map(m=>`<div class="bubble ${m.me?'me':''}">${esc(m.text)}<div class="msgtime">${m.time||'ahora'}</div></div>`).join(''):`<div class="bubble">Hola, vi tu solicitud. ¿Podés contarme un poco más del problema?</div><div class="bubble me">Hola. Sí, se perdió agua debajo de la pileta.</div><div class="bubble">Perfecto. Voy a revisarlo y te paso presupuesto antes de comenzar.</div>`}</div><div class="chatInput"><input id="msg" placeholder="Escribir un mensaje..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="send" onclick="sendMessage()">➤</button></div></div>`}
function account(){return `<h2>Tu perfil</h2><p class="muted">Beta local de Soluciona.</p><div class="card"><div class="row gap10"><div class="avatar" style="display:grid;place-items:center;font-size:22px">👤</div><div><b>${user?.name||'Cuenta de prueba'}</b><div class="muted">${user?.phone||'Todavía no creaste una cuenta'}</div></div></div></div><div class="stack"><button class="secondary" onclick="legal('privacy')">Política de privacidad</button><button class="secondary" onclick="legal('client')">Términos del cliente</button><button class="secondary" onclick="providerInfo()">Soy profesional</button><button class="secondary dangerBtn" onclick="eraseData()">Borrar datos locales</button></div><div class="info">Versión 0.3 UI · Los datos de esta beta se guardan solo en este dispositivo. No hay Firebase, pagos reales ni verificaciones documentales reales.</div>`}
function providerDashboard(){return `<div class="backrow"><button class="back" onclick="go('account')">‹</button><div><div class="eyebrow">Soluciona Pro</div><h2>Panel profesional</h2></div></div><div class="card"><div class="row between"><div><b>Perfil de demostración</b><div class="muted">Estado documental</div></div><span class="tag">EN REVISIÓN</span></div><div class="verifyGrid"><div class="verifyItem warn"><span>●</span> Identidad</div><div class="verifyItem warn"><span>●</span> Matrícula</div><div class="verifyItem warn"><span>●</span> Antecedentes</div><div class="verifyItem warn"><span>●</span> Seguro RC</div></div></div><div class="card"><b>Requisitos previstos</b><p class="bio">Identidad, habilitación o matrícula cuando corresponda, antecedentes según política aprobada y cobertura de Responsabilidad Civil para rubros de riesgo definidos por Soluciona.</p></div><button class="secondary" onclick="legal('provider')">Términos del prestador</button>`}
function view(){switch(S.screen){case'home':return home();case'pros':return pros();case'profile':return profile();case'request':return request();case'summary':return summary();case'status':return status();case'requests':return requestsView();case'chatlist':return chatList();case'chat':return chatView();case'account':return account();case'provider':return providerDashboard();default:return home()}}
function render(){header();nav();$('#main').innerHTML=view();$('#main').scrollTop=0}
function go(s){S.screen=s;render()}
function chooseCat(id){S.cat=id;go('pros')}
function openPro(name){S.pro=PROS.find(p=>p.name===name)||PROS[0];S.cat=S.pro.cats[0];go('profile')}
function toggleFav(name){fav=fav.includes(name)?fav.filter(x=>x!==name):[...fav,name];save('sol_fav',fav);render()}
function submitRequest(){if(!S.addr.trim()){S.addr='San Martín 1234';} const r={id:Date.now(),cat:S.cat,problem:S.problem,urgent:S.urgent,addr:S.addr,day:S.day,slot:S.slot,pro:S.pro,status:0,messages:[]};requests.unshift(r);save('sol_requests',requests);S.last=r;S.screen='status';render()}
function rId(){return (S.last||requests[0])?.id}
function advanceStatus(){const r=requests.find(x=>x.id===rId());if(!r)return;if((r.status||0)<4)r.status=(r.status||0)+1;save('sol_requests',requests);S.last=r;render()}
function openChat(id){S.chatId=id;S.screen='chat';render()}
function sendMessage(){const i=$('#msg'),text=i?.value.trim();if(!text)return;const r=requests.find(x=>x.id===S.chatId)||S.last;if(!r)return;r.messages=r.messages||[];r.messages.push({me:true,text,time:'ahora'});save('sol_requests',requests);render();setTimeout(()=>{const rr=requests.find(x=>x.id===r.id);if(rr){rr.messages.push({me:false,text:'Perfecto, lo tengo en cuenta. Te aviso cualquier novedad.',time:'ahora'});save('sol_requests',requests);if(S.screen==='chat'&&S.chatId===rr.id)render()}},650)}
function legal(which){$('#sheet').className='sheet open';$('#sheet').innerHTML=`<div class="sheetBox"><div class="sheetGrip"></div><div class="row between"><b>${which==='privacy'?'Privacidad':which==='provider'?'Términos del prestador':'Términos del cliente'}</b><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="legalText mt10">${esc(LEGAL[which])}</div><button class="primary mt16" onclick="closeSheet()">Entendido</button></div>`}
function closeSheet(){$('#sheet').className='sheet';$('#sheet').innerHTML=''}
function openInfo(){ $('#sheet').className='sheet open';$('#sheet').innerHTML=`<div class="sheetBox"><div class="sheetGrip"></div><h2>Soluciona Beta</h2><p class="muted">Diseño basado en el nuevo branding de marca. Esta versión es demostrativa y funciona localmente.</p><button class="primary" onclick="closeSheet()">Cerrar</button></div>`}
function reportIssue(id){$('#sheet').className='sheet open';$('#sheet').innerHTML=`<div class="sheetBox"><div class="sheetGrip"></div><h2>Reportar un problema</h2><p class="muted">Elegí el motivo del reporte.</p>${['Daño a la propiedad','Lesión o incidente de seguridad','Problema con seguro o documentación','Cobro indebido / pago por fuera','Conducta inapropiada'].map(x=>`<button class="secondary" style="margin-bottom:8px;text-align:left;padding-left:12px" onclick="closeSheet()">${x}</button>`).join('')}<button class="secondary dangerBtn" onclick="closeSheet()">Cancelar</button></div>`}
function providerInfo(){S.screen='provider';render()}
function eraseData(){localStorage.clear();user=null;requests=[];fav=[];S.last=null;go('home')}
setTimeout(()=>$('#splash').classList.add('off'),1150);render();
</script>
</body>
</html>
