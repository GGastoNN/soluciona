function chatView(){const r=requests.find(x=>x.id===S.chatId)||S.last;if(!r)return emptyRequests();const msgs=r.messages||[];return `<div class="backrow"><button class="back" onclick="go('chatlist')">‹</button></div><div class="chatWrap"><div class="chatHead"><img src="${r.pro.img}"><div><b>${r.pro.name}</b><div class="online">● En línea · Demo local</div></div><div class="grow"></div><a href="tel:+543410000000" class="iconbtn" style="text-decoration:none">☎</a><button class="iconbtn">⋮</button></div><div class="messages" id="messages">${msgs.length?msgs.map(m=>`<div class="bubble ${m.me?'me':''}">${esc(m.text)}<div class="msgtime">${m.time||'ahora'}</div></div>`).join(''):`<div class="bubble">Hola, vi tu solicitud. ¿Podés contarme un poco más del problema?</div><div class="bubble me">Hola. Sí, necesito que revises el problema.</div><div class="bubble">Perfecto. Lo reviso y te paso presupuesto antes de comenzar.</div>`}</div><div class="chatInput"><input id="msg" placeholder="Escribir un mensaje..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="send" onclick="sendMessage()">➤</button></div></div>`}
function account(){return `<h2>Tu perfil</h2><p class="muted">Beta local de Soluciona.</p><div class="card"><div class="row gap10"><div class="avatar" style="display:grid;place-items:center;font-size:22px">👤</div><div><b>${user?.name||'Cuenta de prueba'}</b><div class="muted">${user?.phone||'Todavía no creaste una cuenta'}</div></div></div></div><div class="kpiGrid"><div class="kpi"><b>${requests.length}</b><small>Solicitudes</small></div><div class="kpi"><b>${requests.filter(r=>r.rating).length}</b><small>Reseñas</small></div><div class="kpi"><b>${fav.length}</b><small>Favoritos</small></div></div><div class="stack mt16"><button class="secondary" onclick="legal('privacy')">Política de privacidad</button><button class="secondary" onclick="legal('client')">Términos del cliente</button><button class="secondary" onclick="providerInfo()">${localProvider?'Panel profesional':'Soy profesional'}</button><button class="secondary dangerBtn" onclick="eraseData()">Borrar datos locales</button></div><div class="info">Versión 0.4 UI · Datos locales. No hay Firebase, pagos reales ni verificaciones documentales reales.</div>`}
function providerSignup(){const selected=S.providerCats;return `<div class="backrow"><button class="back" onclick="go('account')">‹</button><div><div class="eyebrow">Soluciona Pro</div><h2>Sumate como profesional</h2></div></div><p class="muted">Este alta es demostrativa y se guarda solo en el dispositivo.</p><div class="fieldLabel">Nombre y apellido</div><input id="pn" class="input" value="${esc(localProvider?.name||'')}" placeholder="Nombre y apellido"><div class="fieldLabel">Teléfono</div><input id="pt" class="input" type="tel" value="${esc(localProvider?.phone||'')}" placeholder="341..."><div class="fieldLabel">¿Qué servicios hacés?</div><div class="providerCats">${CATS.map(c=>`<button data-pcat="${c.id}" class="providerCat ${selected.includes(c.id)?'on':''}" onclick="toggleProviderCat('${c.id}')">${c.name}</button>`).join('')}</div><div class="fieldLabel">Zona de trabajo</div><select id="pz"><option>Carcarañá</option><option>Granadero Baigorria</option><option>Rosario</option><option>Funes</option><option>Roldán</option></select><div class="fieldLabel">Matrícula / habilitación</div><input id="pm" class="input" value="${esc(localProvider?.license||'')}" placeholder="Obligatoria para gas y electricidad"><div class="fieldLabel">Certificado de antecedentes</div><input id="paFile" class="input" type="file" accept="image/*,application/pdf"><div class="fieldLabel">Seguro de Responsabilidad Civil</div><input id="prc" class="input" value="${esc(localProvider?.insurance||'')}" placeholder="N.º de póliza (requerido para gas/electricidad en esta beta)"><div class="fieldLabel">Póliza / constancia</div><input id="prcFile" class="input" type="file" accept="image/*,application/pdf"><label class="switchrow"><input id="pterms" type="checkbox"> <span>Acepto los <a class="link" href="#" onclick="event.preventDefault();legal('provider')">términos del prestador</a> y que la documentación se muestre como <b>EN REVISIÓN</b> hasta validación real.</span></label><div id="perr" class="alert hide"></div><button class="primary mt16" onclick="saveProvider()">Enviar solicitud de alta</button>`}
function providerDashboard(){if(!localProvider)return providerSignup();const counts=localProvider.cats.map(c=>`${category(c).name}: ${proCount(c)} perfil(es)`).join(' · ');return `<div class="backrow"><button class="back" onclick="go('account')">‹</button><div><div class="eyebrow">Soluciona Pro</div><h2>Panel profesional</h2></div></div><div class="card"><div class="row between"><div><b>${esc(localProvider.name)}</b><div class="muted">${esc(localProvider.zone)} · ${localProvider.cats.map(c=>category(c).name).join(', ')}</div></div><span class="tag">EN REVISIÓN</span></div><div class="verifyGrid"><div class="verifyItem warn"><span>●</span> Identidad en revisión</div><div class="verifyItem warn"><span>●</span> Matrícula en revisión</div><div class="verifyItem warn"><span>●</span> Antecedentes en revisión</div><div class="verifyItem warn"><span>●</span> Seguro RC en revisión</div></div></div><div class="card"><b>Disponibilidad</b><p class="muted">${counts}</p><label class="switchrow"><input type="checkbox" ${localProvider.available!==false?'checked':''} onchange="toggleProviderAvailability(this.checked)"> <span>Disponible para aparecer en búsquedas de esta beta local.</span></label></div><div class="card"><b>Documentos demo</b><div class="docGrid mt10"><div class="docBox"><b>Matrícula</b><span class="docPending">${esc(localProvider.license||'No informada')}</span></div><div class="docBox"><b>Antecedentes</b><span class="docPending">${esc(localProvider.backgroundFile||'Archivo local')}</span></div><div class="docBox"><b>Seguro RC</b><span class="docPending">${esc(localProvider.insurance||'No informado')}</span></div><div class="docBox"><b>Estado</b><span class="docPending">EN REVISIÓN</span></div></div></div><button class="secondary" onclick="go('providerSignup')">Editar perfil demo</button><button class="secondary mt10" onclick="legal('provider')">Términos del prestador</button><button class="secondary dangerBtn mt10" onclick="deleteProvider()">Eliminar perfil profesional demo</button>`}
function view(){switch(S.screen){case'home':return home();case'pros':return pros();case'profile':return profile();case'request':return request();case'summary':return summary();case'status':return status();case'requests':return requestsView();case'chatlist':return chatList();case'chat':return chatView();case'account':return account();case'providerSignup':return providerSignup();case'provider':return providerDashboard();default:return home()}}
function render(){header();nav();$('#main').innerHTML=view();$('#main').scrollTop=0}
function go(s){S.screen=s;render()}
function chooseCat(id){if(!proCount(id)){noSupply(id);return}S.cat=id;const ps=prosFor(id);S.pro=ps[0]||S.pro;if(S.urgent)S.sort='dist';go('pros')}
function openPro(name){S.pro=allPros().find(p=>p.name===name)||allPros()[0];S.cat=S.pro.cats[0];go('profile')}
function toggleFav(name){fav=fav.includes(name)?fav.filter(x=>x!==name):[...fav,name];save('sol_fav',fav);render()}
function submitRequest(){if(!S.addr.trim())S.addr='San Martín 1234';const r={id:Date.now(),cat:S.cat,problem:S.problem,urgent:S.urgent,addr:S.addr,day:S.day,slot:S.slot,pro:S.pro,status:0,messages:[],rating:0,comment:''};requests.unshift(r);save('sol_requests',requests);S.last=r;S.screen='status';render()}
function rId(){return (S.last||requests[0])?.id}
function advanceStatus(){const r=requests.find(x=>x.id===rId());if(!r)return;if((r.status||0)<4)r.status=(r.status||0)+1;save('sol_requests',requests);S.last=r;render();if(r.status===4&&!r.rating)setTimeout(()=>openReview(r.id),250)}
function openReview(id){const r=requests.find(x=>x.id===id);if(!r||(r.status||0)<4)return;S.reviewId=id;S.rating=r.rating||0;openSheet(`<div class="row between"><div><div class="eyebrow">Trabajo finalizado</div><h2>Calificá el servicio</h2></div><button class="iconbtn" onclick="closeSheet()">×</button></div><p class="muted">Tu reseña queda asociada a este trabajo y ayuda a otros clientes a comparar profesionales.</p><div id="starrow" class="starRow">${starButtons()}</div><div class="fieldLabel">Comentario <span class="muted">(opcional)</span></div><textarea id="reviewComment" maxlength="500" placeholder="Ej.: llegó a horario, explicó el problema y dejó todo limpio...">${esc(r.comment||'')}</textarea><div id="reviewErr" class="alert hide"></div><button class="primary mt16" onclick="saveReview()">Publicar reseña</button>`)}
function starButtons(){return [1,2,3,4,5].map(i=>`<button class="starBtn ${S.rating===i?'on':''}" onclick="selectRating(${i})">★</button>`).join('')}
function selectRating(n){S.rating=n;const row=$('#starrow');if(row)row.innerHTML=starButtons()}
function saveReview(){const r=requests.find(x=>x.id===S.reviewId),c=$('#reviewComment')?.value.trim()||'';if(!r||!S.rating){const e=$('#reviewErr');if(e){e.classList.remove('hide');e.textContent='Elegí una puntuación de 1 a 5 estrellas.'}return}r.rating=S.rating;r.comment=c;r.reviewedAt=new Date().toISOString();save('sol_requests',requests);closeSheet();S.last=r;render()}
function openChat(id){S.chatId=id;S.screen='chat';render()}
function sendMessage(){const i=$('#msg'),text=i?.value.trim();if(!text)return;const r=requests.find(x=>x.id===S.chatId)||S.last;if(!r)return;r.messages=r.messages||[];r.messages.push({me:true,text,time:'ahora'});save('sol_requests',requests);render();setTimeout(()=>{const rr=requests.find(x=>x.id===r.id);if(rr){rr.messages.push({me:false,text:'Perfecto, lo tengo en cuenta. Te aviso cualquier novedad.',time:'ahora'});save('sol_requests',requests);if(S.screen==='chat'&&S.chatId===rr.id)render()}},650)}
function legal(which){openSheet(`<div class="row between"><b>${which==='privacy'?'Privacidad':which==='provider'?'Términos del prestador':'Términos del cliente'}</b><button class="iconbtn" onclick="closeSheet()">×</button></div><div class="legalText mt10">${esc(LEGAL[which])}</div>`)}
function openSheet(body){const sh=$('#sheet');sh.className='sheet open';sh.innerHTML=`<div class="sheetBox"><div class="sheetGrip"></div>${body}<button class="secondary mt16" onclick="closeSheet()">Cerrar</button></div>`}
function closeSheet(){$('#sheet').className='sheet';$('#sheet').innerHTML=''}
function openInfo(){openSheet(`<h2>Soluciona Beta 0.4</h2><p class="muted">Integra el nuevo branding y el flujo revisado con disponibilidad por rubro, emergencia, reseñas y alta profesional local.</p>`)}
function reportIssue(id){openSheet(`<h2>Reportar un problema</h2><p class="muted">Elegí el motivo del reporte.</p>${['Daño a la propiedad','Lesión o incidente de seguridad','Problema con seguro o documentación','Cobro indebido / pago por fuera','Conducta inapropiada'].map(x=>`<button class="secondary" style="margin-bottom:8px;text-align:left;padding-left:12px" onclick="closeSheet()">${x}</button>`).join('')}`)}
function providerInfo(){go(localProvider?'provider':'providerSignup')}
function toggleProviderCat(id){S.providerCats=S.providerCats.includes(id)?S.providerCats.filter(x=>x!==id):[...S.providerCats,id];document.querySelectorAll('[data-pcat]').forEach(b=>b.classList.toggle('on',S.providerCats.includes(b.dataset.pcat)))}
function saveProvider(){const name=$('#pn')?.value.trim(),phone=($('#pt')?.value||'').replace(/\D/g,''),license=$('#pm')?.value.trim(),insurance=$('#prc')?.value.trim(),zone=$('#pz')?.value||'Carcarañá',terms=$('#pterms')?.checked,bg=$('#paFile')?.files?.[0],rcf=$('#prcFile')?.files?.[0],riskCat=S.providerCats.some(x=>['gas','elec'].includes(x));let err=!name?'Ingresá tu nombre y apellido.':phone.length<8?'Ingresá un teléfono válido.':!S.providerCats.length?'Elegí al menos un servicio.':riskCat&&!license?'Para gas o electricidad necesitamos matrícula/habilitación.':!bg&&!localProvider?.backgroundFile?'Subí el certificado de antecedentes para esta demo.':riskCat&&!insurance?'Para gas o electricidad informá una póliza de RC en esta beta.':!terms?'Aceptá los términos del prestador.':'';if(err){const e=$('#perr');e.classList.remove('hide');e.textContent=err;return}localProvider={name,phone,license,insurance,zone,cats:[...S.providerCats],available:localProvider?.available!==false,backgroundFile:bg?.name||localProvider?.backgroundFile||'archivo seleccionado',insuranceFile:rcf?.name||localProvider?.insuranceFile||'',status:'EN REVISIÓN'};save('sol_provider',localProvider);S.screen='provider';render()}
function toggleProviderAvailability(v){if(!localProvider)return;localProvider.available=v;save('sol_provider',localProvider);render()}
function deleteProvider(){localStorage.removeItem('sol_provider');localProvider=null;S.providerCats=[];go('account')}
function eraseData(){localStorage.clear();user=null;requests=[];fav=[];localProvider=null;S={screen:'home',cat:'elec',problem:'',urgent:false,urgentTouched:false,addr:'',day:'Hoy',slot:'Tarde (12-18)',pro:BASE_PROS[0],sort:'dist',last:null,chatId:null,rating:0,reviewId:null,providerCats:[]};render()}
setTimeout(()=>$('#splash').classList.add('off'),1150);render();
</script>
</body>
</html>
