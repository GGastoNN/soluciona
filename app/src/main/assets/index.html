<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Soluciona.</title>
<style>
:root{--bg:#f4f7fc;--card:#fff;--text:#14213d;--muted:#64748b;--blue:#2563eb;--blue2:#1d4ed8;--soft:#eaf1fe;--line:#dce4ef;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;--shadow:0 10px 30px #183b6b12}
*{box-sizing:border-box}html,body{height:100%;min-height:100%;margin:0;overscroll-behavior:none}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,textarea,select{font:inherit}button{touch-action:manipulation}.app{height:100%;min-height:100%;width:100%;max-width:760px;margin:auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}.header{min-height:60px;display:flex;align-items:center;gap:10px;padding:8px clamp(14px,4vw,22px);background:rgba(244,247,252,.97);border-bottom:1px solid var(--line);position:relative;z-index:5;flex:none}.brand{font-size:21px;font-weight:800;letter-spacing:-.6px;white-space:nowrap}.dot{color:var(--blue)}.sp{flex:1}.iconbtn{border:0;background:transparent;color:var(--text);font-size:22px;min-width:44px;min-height:44px;padding:8px;border-radius:12px;display:grid;place-items:center}.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px clamp(14px,4vw,24px) 28px;-webkit-overflow-scrolling:touch;overflow-wrap:anywhere}.nav{display:none;grid-template-columns:repeat(4,minmax(0,1fr));padding:7px 6px max(8px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);flex:none}.nav.show{display:grid}.nav button{border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;min-height:50px;padding:5px 2px;border-radius:12px}.nav button span{display:block;font-size:20px;margin-bottom:2px}.nav button.on{color:var(--blue);background:var(--soft)}
h1{font-size:29px;line-height:1.08;letter-spacing:-1px;margin:8px 0 8px}h2{font-size:23px;letter-spacing:-.6px;margin:4px 0 8px}h3{margin:20px 0 8px}.sub{color:var(--muted);font-size:14px;line-height:1.45;margin:0 0 16px}.hero{background:linear-gradient(145deg,#2563eb,#1d4ed8);color:#fff;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 18px 45px #2563eb25}.hero h1{margin:0 0 7px}.hero .sub{color:#dbeafe;margin:0}.mark{width:58px;height:58px;border-radius:17px;background:#fff;display:grid;place-items:center;margin-bottom:16px;overflow:hidden}.mark img{width:100%;height:100%;object-fit:cover;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}.card.flat{box-shadow:none}.row{display:flex;gap:12px;align-items:center}.top{align-items:flex-start}.grow{flex:1}.avatar{width:48px;height:48px;border-radius:16px;background:var(--soft);color:var(--blue);font-weight:800;display:grid;place-items:center;font-size:19px}.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--soft);color:var(--blue);padding:4px 8px;font-size:11px;font-weight:800;margin:2px 3px 2px 0}.badge.ok{background:#ecfdf3;color:#15803d}.badge.warn{background:#fff7ed;color:#b45309}.badge.danger{background:#fef2f2;color:#b91c1c}.metric{font-size:12px;color:var(--muted);margin-top:4px}
label.lbl{display:block;font-size:13px;font-weight:800;margin:13px 0 6px}.input,textarea,select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:13px 14px;outline:0}.input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb15}textarea{min-height:105px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;background:var(--card);padding:8px 11px;color:var(--text);font-size:12px;font-weight:700}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn{width:100%;border:0;border-radius:15px;padding:14px 16px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.primary:active{background:var(--blue2)}.secondary{background:var(--card);color:var(--blue);border:1px solid var(--line)}.dangerBtn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.link{border:0;background:none;color:var(--blue);font-weight:700;padding:4px}.notice{padding:12px 13px;border-radius:14px;background:var(--soft);font-size:13px;line-height:1.45;margin:10px 0}.notice.warn{background:#fff7ed;color:#9a3412}.notice.danger{background:#fef2f2;color:#991b1b}.empty{text-align:center;padding:34px 12px;color:var(--muted)}.loader{width:30px;height:30px;border:3px solid #cbd5e1;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:25vh auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
.status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}.status:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--warn)}.status.ok:before{background:var(--ok)}.status.bad:before{background:var(--danger)}.requestActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.requestActions button{width:auto;padding:9px 11px}.chat{display:flex;flex-direction:column;gap:7px;padding:8px 0}.bubble{max-width:82%;background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px 11px;font-size:14px}.bubble.me{margin-left:auto;background:var(--blue);color:white;border-color:var(--blue)}.chatbar{display:flex;gap:7px;position:sticky;bottom:0;background:var(--bg);padding:10px 0}.chatbar .input{flex:1}.chatbar button{width:54px}.footerlinks{text-align:center;color:var(--muted);font-size:12px;margin:18px 0}.footerlinks button{color:var(--blue);border:0;background:none;padding:3px}.error{color:var(--danger);font-size:13px;margin:8px 0}.success{color:var(--ok);font-size:13px;margin:8px 0}.urgent{display:flex;align-items:center;gap:10px;background:#fff1f2;border:1px solid #fecdd3;border-radius:15px;padding:12px;margin:10px 0}.urgent input{width:20px;height:20px}.sep{height:1px;background:var(--line);margin:14px 0}
@media(max-width:360px){h1{font-size:26px}.grid2{grid-template-columns:1fr}.screen{padding-left:13px;padding-right:13px}.btnrow{grid-template-columns:1fr}}
@media(min-width:600px){.header{padding-left:24px;padding-right:24px}.screen{padding:24px 28px 34px}.hero{padding:28px}.card{padding:18px}.grid2{gap:12px}.nav{padding-left:18px;padding-right:18px}.nav button{font-size:12px}}
@media(max-height:620px){.hero{padding:18px}.hero .mark{width:48px;height:48px;font-size:22px;margin-bottom:10px}.screen{padding-top:12px}.header{min-height:54px}}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#172033;--text:#f1f5f9;--muted:#94a3b8;--soft:#193767;--line:#2d3b52;--shadow:none}.header{background:#0f172af5}.notice{color:#dbeafe}.nav{background:#172033}.input,textarea,select{background:#172033}.bubble{background:#172033}}
</style>
  <link rel="stylesheet" href="ui-polish.css">
</head>
<body>
<div class="app"><header class="header" id="header"><div class="brand">Soluciona<span class="dot">.</span></div><div class="sp"></div></header><main class="screen" id="screen"></main><nav class="nav" id="nav"></nav></div>
<script src="ui-runtime.js"></script>
<script>
const N=window.SolucionaNative,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={screen:'loading',profile:null,zones:[],categories:[],pros:[],requests:[],open:[],jobs:[],selectedCategory:'',selectedZone:'',selectedPro:'',reqText:'',reqUrgent:false,chatId:'',messages:[],registerRole:'CLIENT',loading:false};
const icon={electricidad:'⚡',plomeria:'💧',gas:'🔥',climatizacion:'❄️',cerrajeria:'🔑',construccion:'🧱'};
function jsAction(name,...args){return esc(name+'('+args.map(a=>JSON.stringify(String(a))).join(',')+')')}
function selectProfessional(uid){state.selectedPro=uid;render()}
function nameFor(list,id){return (list.find(x=>x.id===id)||{}).name||id}
function addressText(a){if(!a)return'';return [a.street,a.number,a.floor,a.apartment,a.city,a.province].filter(Boolean).join(' ')}
const backStack=[];
function homeScreen(){if(state.profile&&!state.profile.emailVerified)return'verify';if(state.profile?.role==='PROFESSIONAL')return'proHome';if(state.profile)return'clientHome';return'welcome'}
function setScreen(s,push=true){if(!s)return;if(s===state.screen){render();return}if(push&&state.screen&&state.screen!=='loading')backStack.push(state.screen);state.screen=s;render()}
function replaceScreen(s){backStack.length=0;state.screen=s;render()}
function toast(msg,bad=false){const old=$('#toast');if(old)old.remove();const d=document.createElement('div');d.id='toast';d.textContent=msg;d.style.cssText=`position:fixed;left:50%;bottom:90px;transform:translateX(-50%);max-width:90%;z-index:50;background:${bad?'#991b1b':'#14213d'};color:white;padding:10px 14px;border-radius:12px;font:600 13px system-ui;box-shadow:0 10px 30px #0004`;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function v(id){return ($('#'+id)?.value||'').trim()}
function requireCatalog(){if(!state.zones.length||!state.categories.length)toast('Todavía no hay zonas o categorías habilitadas.',true)}
function header(back){$('#header').innerHTML=`${back?`<button class="iconbtn" aria-label="Volver" onclick="historyBack()">←</button>`:''}<div class="brand">Soluciona<span class="dot">.</span></div><div class="sp"></div>${state.profile?`<button class="iconbtn" aria-label="Mi cuenta" onclick="setScreen('account')">👤</button>`:''}`}
function historyBack(){if(backStack.length){state.screen=backStack.pop();render();return true}const home=homeScreen();if(state.screen!==home){state.screen=home;render();return true}return false}
window.solucionaAndroidBack=()=>historyBack();
function nav(active){const el=$('#nav');if(!state.profile||!state.profile.emailVerified){el.className='nav';el.innerHTML='';return}el.className='nav show';const isPro=state.profile.role==='PROFESSIONAL';const items=isPro?[['proHome','⌂','Inicio'],['proJobs','🧰','Trabajos'],['chatList','💬','Chat'],['account','👤','Perfil']]:[['clientHome','⌂','Inicio'],['clientRequests','📋','Solicitudes'],['chatList','💬','Chat'],['account','👤','Perfil']];el.innerHTML=items.map(i=>`<button class="${active===i[0]?'on':''}" onclick="goNav('${i[0]}')"><span>${i[1]}</span>${i[2]}</button>`).join('')}
function goNav(s){backStack.length=0;state.screen=s;if(s==='clientRequests'){requestHistory('clientRequests')}else if(s==='proJobs'){requestHistory('professionalJobs')}else if(s==='proHome'){requestHistory('openRequests')}else if(s==='chatList'){if(state.profile.role==='PROFESSIONAL')requestHistory('professionalJobs');else requestHistory('clientRequests')}render()}
let renderedScreen='', listeningChat='', pendingChatSend=null;
window.solucionaResumeChat=()=>{if(state.screen==='chat'&&state.chatId)N.listMessages(state.chatId)};
const patchChildren=SolucionaUI.patchChildren;
const historyPages={openRequests:{hasMore:false,loading:false,error:''},clientRequests:{hasMore:false,loading:false,error:''},professionalJobs:{hasMore:false,loading:false,error:''}};
const chatPage={hasMore:false,loading:false,error:'',ready:false,fromCache:false};
function loadMoreHistory(event){
  const page=historyPages[event];if(page.loading)return;page.loading=true;page.error='';render();
  if(event==='openRequests')N.loadMoreOpenRequests();else if(event==='professionalJobs')N.loadMoreProfessionalJobs();else N.loadMoreClientRequests();
}
function requestHistory(event){
  Object.assign(historyPages[event],{loading:true,error:''});
  if(event==='openRequests')N.listOpenRequests();else if(event==='professionalJobs')N.listProfessionalJobs();else N.listClientRequests();
}
function reloadHistory(event){requestHistory(event);render()}
function historyControls(event){
  const page=historyPages[event];
  return `<div id="historyControls" aria-live="polite">${page.fromCache?'<div class="notice warn">Mostrando datos guardados. Actualizá cuando recuperes la conexión.</div>':''}${page.error?`<div class="notice danger">${esc(page.error)}</div><button class="btn secondary" onclick="reloadHistory('${event}')">Reintentar</button>`:''}${page.hasMore&&!page.error?`<button class="btn secondary" ${page.loading?'disabled':''} onclick="loadMoreHistory('${event}')">${page.loading?'Cargando…':'Cargar más'}</button>`:''}</div>`;
}
function loadOlderChat(){if(chatPage.loading)return;chatPage.loading=true;chatPage.error='';render();N.loadOlderMessages(state.chatId)}
function retryChat(){chatPage.error='';chatPage.loading=false;render();N.listMessages(state.chatId)}
function applyHistory(event,p){
  if(!state.profile||p.ownerUid!==state.profile.uid)return;
  const key=event==='openRequests'?'open':event==='professionalJobs'?'jobs':'requests';
  state[key]=p.append?SolucionaUI.mergeById(state[key],p.requests||[]):p.requests||[];
  Object.assign(historyPages[event],{hasMore:!!p.hasMore,loading:false,error:'',partial:!!p.privateDataUnavailable,fromCache:!!p.fromCache});
  if(['clientRequests','proJobs','chatList','proHome'].includes(state.screen))render();
}
function render(){
  const anchor=state.screen==='chat'?Array.from(document.querySelectorAll('#chatMessages [data-key]')).find(el=>el.getBoundingClientRect().bottom>$('#screen').getBoundingClientRect().top):null;
  const anchorTop=anchor?.getBoundingClientRect().top;
  const chat=state.screen==='chat'?state.chatId:'';
  if(listeningChat!==chat){if(listeningChat&&N.stopMessages)N.stopMessages();listeningChat=chat;if(chat)N.listMessages(chat)}
  header(!['loading','welcome','clientHome','proHome'].includes(state.screen));nav(state.screen);
  const s=$('#screen'),fn=views[state.screen]||views.loading;
  if(renderedScreen===state.screen){
    const top=window.scrollY,scroll=s.scrollTop,t=document.createElement('template');t.innerHTML=fn();
    if(state.screen==='registerPro'){const choices=t.content.querySelector('#proServices');if(choices)choices.innerHTML=proChoicesHTML()}
    patchChildren(s,t.content);s.scrollTop=scroll;window.scrollTo(0,top);
    if(anchor&&anchor.isConnected)s.scrollTop+=anchor.getBoundingClientRect().top-anchorTop;
  }else{s.innerHTML=fn();renderedScreen=state.screen;if(state.screen==='registerPro')renderProChoices()}
  s.querySelectorAll('label.lbl').forEach(label=>{const field=label.nextElementSibling;if(field?.id&&field.matches('input,select,textarea'))label.htmlFor=field.id});
}

const views={
loading:()=>`<div class="loader"></div><div class="sub" style="text-align:center">Conectando con Soluciona…</div>`,
welcome:()=>`<div class="hero"><div class="mark"><img src="brand_icon.png" alt="Logo Soluciona"></div><h1>Encontrá. Resolvé. Listo.</h1><p class="sub">Conectamos clientes con profesionales reales de su zona.</p></div><button class="btn primary" onclick="state.registerRole='CLIENT';setScreen('registerClient')">Necesito un servicio</button><div style="height:8px"></div><button class="btn secondary" onclick="state.registerRole='PROFESSIONAL';setScreen('registerPro')">Soy profesional</button><div style="height:16px"></div><button class="link" style="width:100%" onclick="setScreen('login')">Ya tengo una cuenta</button><div class="footerlinks"><button onclick="setScreen('privacy')">Privacidad</button> · <button onclick="setScreen('terms')">Términos</button></div>`,
login:()=>`<h1>Ingresar</h1><p class="sub">Usá tu correo y contraseña.</p><label class="lbl">Correo</label><input class="input" id="liEmail" type="email" autocomplete="email" placeholder="nombre@correo.com"><label class="lbl">Contraseña</label><input class="input" id="liPass" type="password" autocomplete="current-password" placeholder="Tu contraseña"><div id="formMsg" class="error"></div><button class="btn primary" onclick="login()">Ingresar</button><div style="height:8px"></div><button class="btn secondary" onclick="resetPassword()">Recuperar contraseña</button>`,
registerClient:()=>registerBase('CLIENT'),
registerPro:()=>registerBase('PROFESSIONAL'),
verify:()=>`<h1>Verificá tu cuenta</h1><p class="sub">Te enviamos un enlace al correo <b>${esc(state.profile?.email||state.pendingEmail||'')}</b>. Abrilo y volvé a la app.</p><div class="notice">Soluciona usa correo y contraseña para autenticar tu cuenta. El teléfono queda solo como dato de contacto y no requiere verificación por SMS.</div><button class="btn primary" onclick="N.refreshSession()">Ya verifiqué mi correo</button><div style="height:8px"></div><button class="link" style="width:100%" onclick="N.resendEmailVerification()">Reenviar correo</button><div style="height:8px"></div><button class="link" style="width:100%" onclick="logout()">Usar otra cuenta</button>`,
clientHome:()=>clientHome(),
pros:()=>professionalsView(),
clientRequests:()=>requestsView(state.requests,false),
proHome:()=>proHome(),
proJobs:()=>requestsView(state.jobs,true),
chatList:()=>chatList(),
chat:()=>chatView(),
account:()=>accountView(),
privacy:()=>privacyView(),
terms:()=>termsView()
};
function registerBase(role){const pro=role==='PROFESSIONAL';return`<h1>${pro?'Sumate como profesional':'Creá tu cuenta'}</h1><p class="sub">Todos los datos se registran en Firebase. No usamos cuentas de demostración.</p><label class="lbl">Nombre y apellido</label><input class="input" id="rgName" autocomplete="name"><label class="lbl">Correo electrónico</label><input class="input" id="rgEmail" type="email" autocomplete="email"><label class="lbl">Teléfono de contacto</label><input class="input" id="rgPhone" type="tel" inputmode="tel" placeholder="341 555 0000"><div class="metric">Se usa solo como dato de contacto. No se utiliza para iniciar sesión ni requiere SMS.</div><label class="lbl">Contraseña</label><input class="input" id="rgPass" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"><h3>Dirección</h3><div class="grid2"><div><label class="lbl">Calle</label><input class="input" id="rgStreet"></div><div><label class="lbl">Número</label><input class="input" id="rgNumber"></div></div><div class="grid2"><div><label class="lbl">Piso / depto.</label><input class="input" id="rgFloor"></div><div><label class="lbl">Código postal</label><input class="input" id="rgPostal"></div></div><label class="lbl">Ciudad</label><input class="input" id="rgCity"><label class="lbl">Provincia</label><input class="input" id="rgProvince" value="Santa Fe">${pro?`<h3>Perfil profesional</h3><label class="lbl">Servicios</label><div class="chips" id="proServices"></div><label class="lbl">Zona de trabajo principal</label><select id="proZone">${state.zones.map(z=>`<option value="${esc(z.id)}">${esc(z.name)}</option>`).join('')}</select><label class="lbl">Matrícula / habilitación</label><input class="input" id="proLicense" placeholder="Número, si corresponde"><label class="lbl">Jurisdicción</label><input class="input" id="proJurisdiction" placeholder="Ej.: Santa Fe"><div class="notice warn">Después del registro, el perfil queda pendiente de revisión. Matrícula, antecedentes y seguro se validan antes de mostrar el perfil como verificado.</div>`:''}<div id="formMsg" class="error"></div><button class="btn primary" onclick="register('${role}')">${pro?'Crear cuenta profesional':'Crear cuenta'}</button>`}
function proChoicesHTML(){return state.categories.map(c=>`<button type="button" class="chip" data-id="${esc(c.id)}" onclick="this.classList.toggle('on');this.setAttribute('aria-pressed',this.classList.contains('on'))" aria-pressed="false">${icon[c.id]||'🛠️'} ${esc(c.name)}</button>`).join('')}
function renderProChoices(){const e=$('#proServices');if(e)e.innerHTML=proChoicesHTML()}

function register(role){const msg=$('#formMsg');const data={name:v('rgName'),email:v('rgEmail'),phone:v('rgPhone'),password:v('rgPass'),address:{street:v('rgStreet'),number:v('rgNumber'),floor:v('rgFloor'),postalCode:v('rgPostal'),city:v('rgCity'),province:v('rgProvince')}};let err=!data.name?'Ingresá tu nombre.':!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email)?'Ingresá un correo válido.':data.phone.replace(/\D/g,'').length<8?'Ingresá un teléfono válido.':data.password.length<6?'La contraseña debe tener al menos 6 caracteres.':!data.address.street||!data.address.number||!data.address.city||!data.address.province?'Completá la dirección.':'';if(role==='PROFESSIONAL'){data.services=[...document.querySelectorAll('#proServices .on')].map(x=>x.dataset.id);data.zones=[v('proZone')];data.licenseNumber=v('proLicense');data.licenseJurisdiction=v('proJurisdiction');if(!data.services.length)err='Elegí al menos un servicio.'}if(err){msg.textContent=err;return}msg.textContent='Creando cuenta…';state.pendingEmail=data.email;if(role==='PROFESSIONAL')N.registerProfessional(JSON.stringify(data));else N.registerClient(JSON.stringify(data))}
function login(){const e=v('liEmail'),p=v('liPass');$('#formMsg').textContent='Ingresando…';N.signIn(e,p)}
function resetPassword(){const e=v('liEmail');if(!e){$('#formMsg').textContent='Ingresá tu correo.';return}N.sendPasswordReset(e)}
function clientHome(){const a=state.profile?.address||{};return`<div class="hero"><h1>¿Qué necesitás solucionar?</h1><p class="sub">Publicá tu solicitud y elegí si querés enviarla a un profesional disponible.</p></div><label class="lbl">Rubro</label><select id="reqCat" onchange="state.selectedCategory=this.value;loadPros()"><option value="">Elegí un rubro</option>${state.categories.map(c=>`<option value="${esc(c.id)}" ${state.selectedCategory===c.id?'selected':''}>${icon[c.id]||'🛠️'} ${esc(c.name)}</option>`).join('')}</select><label class="lbl">Zona</label><select id="reqZone" onchange="state.selectedZone=this.value;loadPros()"><option value="">Elegí una zona</option>${state.zones.map(z=>`<option value="${esc(z.id)}" ${state.selectedZone===z.id?'selected':''}>${esc(z.name)}</option>`).join('')}</select><label class="lbl">Contanos el problema</label><textarea id="reqText" placeholder="Ej.: Tengo una pérdida debajo de la pileta y necesito revisarla hoy.">${esc(state.reqText)}</textarea><label class="urgent"><input type="checkbox" id="reqUrgent" ${state.reqUrgent?'checked':''}><div><b>Atención urgente</b><div class="metric">Marcala solo si necesitás prioridad.</div></div></label><div class="card flat"><b>Dirección del servicio</b><div class="metric">${esc(addressText(a)||'Completá tu dirección en el perfil')}</div></div><button class="btn secondary" onclick="loadPros(true)">Ver profesionales disponibles</button><div style="height:8px"></div><button class="btn primary" onclick="createRequest()">Enviar solicitud</button>`}
function loadPros(openScreen=false){state.selectedCategory=v('reqCat')||state.selectedCategory;state.selectedZone=v('reqZone')||state.selectedZone;state.reqText=v('reqText')||state.reqText;state.reqUrgent=$('#reqUrgent')?.checked||false;if(!state.selectedCategory||!state.selectedZone){if(openScreen)toast('Elegí rubro y zona.',true);return}state.pros=[];N.listProfessionals(state.selectedCategory,state.selectedZone);if(openScreen)setScreen('pros')}
function professionalsView(){return`<h2>Profesionales disponibles</h2><p class="sub">${esc(nameFor(state.categories,state.selectedCategory))} · ${esc(nameFor(state.zones,state.selectedZone))}</p><div class="notice">Podés elegir uno para dirigirle la solicitud o dejar “Cualquiera disponible”.</div><div class="card ${!state.selectedPro?'flat':''}" onclick="state.selectedPro='';render()"><div class="row"><div class="avatar">∞</div><div class="grow"><b>Cualquiera disponible</b><div class="metric">La solicitud podrá ser aceptada por un profesional aprobado de tu zona.</div></div>${!state.selectedPro?'✓':''}</div></div>${state.pros.length?state.pros.map(p=>`<div class="card" onclick="${jsAction('selectProfessional',p.uid)}"><div class="row"><div class="avatar">${esc((p.displayName||'P')[0])}</div><div class="grow"><b>${esc(p.displayName)}</b><div><span class="badge ok">✓ Perfil aprobado</span></div><div class="metric">★ ${Number(p.rating||0).toFixed(1)} · ${p.reviewCount||0} reseñas · ${p.completedJobs||0} trabajos</div></div>${state.selectedPro===p.uid?'✓':''}</div></div>`).join(''):`<div class="empty">No hay profesionales aprobados y disponibles para esta combinación todavía.</div>`}<button class="btn primary" onclick="setScreen('clientHome')">Volver a la solicitud</button>`}
function createRequest(){const cat=v('reqCat')||state.selectedCategory,zone=v('reqZone')||state.selectedZone,text=v('reqText')||state.reqText;if(!cat||!zone||text.length<10){toast('Elegí rubro, zona y describí el problema con al menos 10 caracteres.',true);return}const p=state.profile,a=p?.address||{};N.createServiceRequest(JSON.stringify({categoryId:cat,zoneId:zone,description:text,urgent:$('#reqUrgent')?.checked||state.reqUrgent||false,address:a,preferredProfessionalUid:state.selectedPro||''}))}
function statusLabel(s){return({REQUESTED:'Solicitado',ACCEPTED:'Aceptado',ON_THE_WAY:'En camino',IN_PROGRESS:'En trabajo',COMPLETED:'Finalizado',CANCELLED:'Cancelado'})[s]||s}
function requestsView(list,pro){const event=pro?'professionalJobs':'clientRequests',page=historyPages[event];return`<h2>${pro?'Mis trabajos':'Mis solicitudes'}</h2><p class="sub">Tus servicios, del más reciente al más antiguo.</p>${page.partial?'<div class="notice warn">Algunas direcciones no pudieron sincronizarse. Actualizá para reintentarlo.</div>':''}<button class="link" onclick="reloadHistory('${event}')" ${page.loading?'disabled':''}>${page.loading?'Cargando…':'Actualizar'}</button><div id="requestItems">${list.length?list.map(r=>requestCard(r,pro)).join(''):page.error?'':`<div class="empty">${page.loading?'Cargando servicios…':`Todavía no hay ${pro?'trabajos asignados':'solicitudes'}.`}</div>`}</div>${historyControls(event)}`}

function requestCard(r,pro){const addr=addressText(r.address);return`<div class="card"><div class="row top"><div class="avatar">${icon[r.categoryId]||'🛠️'}</div><div class="grow"><b>${esc(nameFor(state.categories,r.categoryId))}${r.urgent?' · Urgente':''}</b><div class="status ${r.status==='COMPLETED'?'ok':r.status==='CANCELLED'?'bad':''}">${esc(statusLabel(r.status))}</div><div class="metric">${esc(r.description)}</div><div class="metric">📍 ${esc(addr||nameFor(state.zones,r.zoneId))}</div></div></div><div class="requestActions">${pro&&r.status==='ACCEPTED'?`<button class="btn primary" onclick="${jsAction('N.updateRequestStatus',r.id,'ON_THE_WAY')}">Estoy en camino</button>`:''}${pro&&r.status==='ON_THE_WAY'?`<button class="btn primary" onclick="${jsAction('N.updateRequestStatus',r.id,'IN_PROGRESS')}">Iniciar trabajo</button>`:''}${pro&&r.status==='IN_PROGRESS'?`<button class="btn primary" onclick="${jsAction('N.updateRequestStatus',r.id,'COMPLETED')}">Finalizar</button>`:''}${!pro&&!['COMPLETED','CANCELLED'].includes(r.status)?`<button class="btn dangerBtn" onclick="${jsAction('N.cancelRequest',r.id)}">Cancelar</button>`:''}${r.professionalUid&&r.status!=='CANCELLED'?`<button class="btn secondary" onclick="${jsAction('openChat',r.id)}">💬 Chat</button>`:''}</div></div>`}
function proHome(){const p=state.profile||{},approved=p.verificationStatus==='APPROVED';return`<div class="hero"><h1>Hola, ${esc((p.displayName||'Profesional').split(' ')[0])}</h1><p class="sub">Gestioná tu disponibilidad y los pedidos de tu zona.</p></div><div class="card"><div class="row"><div class="grow"><b>Estado del perfil</b><div class="metric">${approved?'Aprobado por Soluciona':'Pendiente de validación documental'}</div></div><span class="badge ${approved?'ok':'warn'}">${approved?'✓ Verificado':'En revisión'}</span></div>${!approved?`<div class="notice warn">No recibirás pedidos hasta que Soluciona valide matrícula/habilitación, antecedentes y los documentos requeridos.</div>${state.profile.documentsApiConfigured?`<div class="requestActions"><button class="btn secondary" onclick="N.chooseProfessionalDocument('LICENSE')">📄 Subir matrícula</button><button class="btn secondary" onclick="N.chooseProfessionalDocument('BACKGROUND_CHECK')">📄 Antecedentes</button><button class="btn secondary" onclick="N.chooseProfessionalDocument('INSURANCE')">🛡 Seguro RC</button></div>`:`<div class="metric">La carga documental online se habilitará al conectar el servidor R2; mientras tanto administración puede gestionar la validación.</div>`}`:''}</div><div class="card"><div class="row"><div class="grow"><b>Disponible para trabajar</b><div class="metric">Aparecés en búsquedas solo cuando el perfil está aprobado.</div></div><input type="checkbox" style="width:22px;height:22px" ${p.availability?'checked':''} ${approved?'':'disabled'} onchange="N.setProfessionalAvailability(this.checked)"></div></div><h3>Pedidos nuevos</h3><button class="link" onclick="reloadHistory('openRequests')">Actualizar pedidos</button>${state.open.length?state.open.map(r=>`<div class="card"><b>${icon[r.categoryId]||'🛠️'} ${esc(nameFor(state.categories,r.categoryId))}${r.urgent?' · Urgente':''}</b><div class="metric">${esc(r.description)}</div><div class="metric">Zona: ${esc(nameFor(state.zones,r.zoneId))}</div><div style="height:10px"></div><button class="btn primary" onclick="${jsAction('N.acceptRequest',r.id)}">Aceptar pedido</button></div>`).join(''):`<div class="empty">${historyPages.openRequests.loading?'Buscando pedidos compatibles…':historyPages.openRequests.hasMore?'No hay pedidos compatibles en este bloque. Podés cargar más.':'No hay pedidos nuevos compatibles en los bloques consultados.'}</div>`}${historyControls('openRequests')}`}
function chatList(){const event=state.profile.role==='PROFESSIONAL'?'professionalJobs':'clientRequests';const list=state.profile.role==='PROFESSIONAL'?state.jobs:state.requests;const active=list.filter(r=>r.professionalUid&&r.status!=='CANCELLED');return`<h2>Chats</h2><p class="sub">Los chats se habilitan cuando un profesional acepta una solicitud.</p>${active.length?active.map(r=>`<div class="card" onclick="${jsAction('openChat',r.id)}"><b>💬 ${esc(nameFor(state.categories,r.categoryId))}</b><div class="metric">${esc(statusLabel(r.status))} · ${esc(r.description)}</div></div>`).join(''):`<div class="empty">Todavía no tenés conversaciones activas.</div>`}${historyControls(event)}`}
function openChat(id){state.chatId=id;state.messages=[];Object.assign(chatPage,{hasMore:false,loading:false,error:'',ready:false,fromCache:false});setScreen('chat')}
function chatView(){const uid=state.profile?.uid;return`<h2>Chat del servicio</h2><div id="chatHistoryControls" aria-live="polite">${chatPage.error?`<div class="notice danger">${esc(chatPage.error)}</div><button class="btn secondary" onclick="retryChat()">Reintentar conexión</button>`:''}${chatPage.fromCache?'<div class="notice warn">Mostrando mensajes guardados. Esperando sincronización.</div>':''}${chatPage.hasMore?`<button class="btn secondary" ${chatPage.loading?'disabled':''} onclick="loadOlderChat()">${chatPage.loading?'Cargando…':'Ver mensajes anteriores'}</button>`:''}</div><div class="chat" id="chatMessages">${state.messages.length?state.messages.map(m=>`<div data-key="${esc(m.id)}" class="bubble ${m.senderUid===uid?'me':''}">${esc(m.text)}</div>`).join(''):`<div class="empty">${chatPage.error?'No pudimos cargar los mensajes.':chatPage.ready?'No hay mensajes todavía.':'Cargando mensajes…'}</div>`}</div><div class="chatbar" id="chatComposer"><input class="input" id="chatText" aria-label="Mensaje" maxlength="1000" placeholder="Escribí un mensaje"><button class="btn primary" aria-label="Enviar mensaje" ${pendingChatSend?'disabled':''} onclick="sendChat()">➤</button></div>`}

function sendChat(){
  const input=$('#chatText'),text=input?.value||'';if(!text.trim()||pendingChatSend)return;
  pendingChatSend={id:state.chatId,uid:state.profile?.uid,text};render();N.sendMessage(state.chatId,text);
}
function handleSendResult(ok,p){
  if(!pendingChatSend||p.requestId!==pendingChatSend.id||p.ownerUid!==pendingChatSend.uid)return;
  if(ok&&state.screen==='chat'&&state.chatId===p.requestId){const input=$('#chatText');if(input&&input.value===pendingChatSend.text)input.value=''}
  pendingChatSend=null;if(state.screen==='chat')render();if(!ok)toast(p.message||'No pudimos enviar el mensaje. Podés reintentarlo.',true);
}
function accountView(){const p=state.profile||{};return`<h2>Mi cuenta</h2><div class="card"><b>${esc(p.displayName)}</b><div class="metric">${esc(p.email)}</div><div class="metric">📞 ${esc(p.phone)} · contacto</div><div class="metric">📍 ${esc(addressText(p.address))}</div><div style="margin-top:8px"><span class="badge ${p.emailVerified?'ok':'warn'}">${p.emailVerified?'✓ Correo verificado':'Correo pendiente'}</span></div></div>${p.privacyOptionsRequired?`<button class="btn secondary" onclick="N.showPrivacyOptions()">Opciones de privacidad de anuncios</button><div style="height:8px"></div>`:''}<button class="btn dangerBtn" onclick="logout()">Cerrar sesión</button><div class="footerlinks"><button onclick="setScreen('privacy')">Política de privacidad</button> · <button onclick="setScreen('terms')">Términos</button><br><a href="mailto:infosoluciona2026@gmail.com" style="color:var(--blue);text-decoration:none">infosoluciona2026@gmail.com</a></div>`}
function privacyView(){return`<h2>Política de privacidad</h2><div class="card"><p class="sub">Soluciona registra los datos necesarios para crear y operar tu cuenta: nombre, correo, teléfono, dirección, rol, solicitudes y comunicaciones vinculadas al servicio. Para profesionales también registra información de actividad y verificación.</p><p class="sub">La autenticación y parte de los datos operativos usan Firebase. La publicidad usa Google Mobile Ads y puede requerir identificadores o consentimiento según la región. Los documentos profesionales se prevén en almacenamiento privado y no se muestran públicamente.</p><p class="sub">Podés solicitar acceso, corrección o baja de tu cuenta escribiendo a <b>infosoluciona2026@gmail.com</b>. La eliminación no implica borrar automáticamente registros que deban conservarse por seguridad, fraude, reclamos u obligaciones legales.</p><p class="sub"><b>Importante para Play Console:</b> esta política también debe publicarse en una URL web accesible antes de la salida pública.</p></div>`}
function termsView(){return`<h2>Términos de uso</h2><div class="card"><p class="sub">Soluciona funciona como plataforma de conexión entre clientes y profesionales. Cada profesional es responsable por su trabajo, documentación y cumplimiento de requisitos aplicables.</p><p class="sub">Los estados de “verificado” solo se muestran cuando Soluciona registra una aprobación administrativa. La app no integra cobros en esta versión; no afirmamos retener, liberar ni garantizar pagos.</p><p class="sub">Las funciones de urgencia ayudan a priorizar solicitudes, pero no reemplazan servicios públicos de emergencia ni indicaciones de seguridad.</p></div>`}
function logout(){pendingChatSend=null;state.messages=[];Object.values(historyPages).forEach(p=>Object.assign(p,{hasMore:false,loading:false,error:'',fromCache:false}));N.signOut();state.profile=null;state.requests=[];state.jobs=[];state.open=[];backStack.length=0;setScreen('welcome',false)}
window.solucionaNativeEvent=function(event,ok,p={}){if(event==='messageSent'){handleSendResult(ok,p);return}if(!ok){if(historyPages[event]){historyPages[event].loading=false;historyPages[event].error=p.message||'No pudimos cargar los servicios.';if(['clientRequests','proJobs','chatList','proHome'].includes(state.screen))render();return}if(event==='messages'){if(state.screen!=='chat'||p.requestId!==state.chatId)return;chatPage.loading=false;chatPage.error=p.message||'No pudimos sincronizar el chat.';render();return}if(event==='session'&&p.message==='NO_SESSION'){state.profile=null;backStack.length=0;setScreen('welcome',false);return}if((event==='session'||event==='signIn')&&p.message==='PROFILE_NOT_FOUND'){N.signOut();state.profile=null;backStack.length=0;setScreen('welcome',false);toast('Tu cuenta no tiene un perfil completo. Volvé a registrarte o contactá a soporte.',true);return}if(event==='session'){state.profile=null;backStack.length=0;setScreen('welcome',false);toast('No pudimos restaurar tu sesión. Podés ingresar nuevamente.',true);return}toast(p.message||'Ocurrió un error.',true);return}if(event==='catalog'){state.zones=p.zones||[];state.categories=p.categories||[];if(['loading','registerPro','clientHome'].includes(state.screen))render();return}if(event==='registerClient'||event==='registerProfessional'){state.pendingEmail=state.pendingEmail||'';backStack.length=0;setScreen('verify',false);return}if(event==='emailVerification'||event==='passwordReset'){toast(p.message||'Listo.');return}if(event==='session'||event==='signIn'){state.profile=p;if(!p.emailVerified){backStack.length=0;setScreen('verify',false);return}state.selectedZone=p.address?.city?state.zones.find(z=>z.name.toLowerCase()===String(p.address.city).toLowerCase())?.id||'':'';if(p.role==='PROFESSIONAL'){state.screen='proHome';requestHistory('openRequests');requestHistory('professionalJobs')}else{state.screen='clientHome';requestHistory('clientRequests')}render();return}if(event==='signOut'){Object.values(historyPages).forEach(page=>Object.assign(page,{hasMore:false,loading:false,error:'',fromCache:false}));state.messages=[];state.requests=[];state.jobs=[];state.open=[];pendingChatSend=null;state.profile=null;backStack.length=0;setScreen('welcome',false);return}if(event==='professionals'){state.pros=p.professionals||[];if(state.screen==='pros')render();return}if(event==='createRequest'){toast('Solicitud publicada.');requestHistory('clientRequests');state.screen='clientRequests';render();return}if(event==='clientRequests'){applyHistory(event,p);return}if(event==='professionalJobs'){applyHistory(event,p);return}if(event==='openRequests'){applyHistory(event,p);return}if(event==='availability'){state.profile.availability=p.availability;toast('Disponibilidad actualizada.');requestHistory('openRequests');render();return}if(event==='documentUpload'){toast('Documento enviado para revisión.');return}if(event==='requestAccepted'){toast(p.message||'Pedido aceptado.');requestHistory('openRequests');requestHistory('professionalJobs');return}if(event==='requestStatus'){toast(p.message||'Estado actualizado.');requestHistory('professionalJobs');return}if(event==='requestCancelled'){toast(p.message||'Solicitud cancelada.');requestHistory('clientRequests');return}if(event==='messages'){if(state.screen!=='chat'||p.requestId!==state.chatId||p.ownerUid!==state.profile?.uid)return;state.messages=SolucionaUI.mergeMessages(state.messages,p.messages||[]);Object.assign(chatPage,{hasMore:!!p.hasMore,ready:true,fromCache:!!p.fromCache,error:''});if(p.older)chatPage.loading=false;render();return}}
if(!N||!N.isAvailable||!N.isAvailable()){
document.getElementById('screen').innerHTML='<div class="empty">Esta versión necesita ejecutarse desde la app Android.</div>'
}else{
N.loadCatalog();
const startupSession=new URLSearchParams(window.location.search).get('session')==='1';
if(!startupSession){
  // Clean install / signed-out launch: never enter the session loader.
  state.profile=null;
  backStack.length=0;
  state.screen='welcome';
  render();
}else{
  // Only a launch that native Firebase identified as having a persisted user
  // is allowed to show "Conectando con Soluciona…".
  state.screen='loading';
  render();
  N.refreshSession();
  setTimeout(()=>{if(state.screen==='loading')N.refreshSession()},700);
  setTimeout(()=>{if(state.screen==='loading'){if(state.profile){state.screen=homeScreen();render()}else{state.profile=null;backStack.length=0;state.screen='welcome';render()}}},2200);
}
}
</script>
</body>
</html>
